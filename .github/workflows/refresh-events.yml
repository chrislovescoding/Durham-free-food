name: Refresh public food events

on:
  schedule:
    # 20:00 Europe/London: summer is UTC+1, winter is UTC+0.
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-food-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Choose the London evening schedule
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          offset = datetime.now(ZoneInfo('Europe/London')).utcoffset().total_seconds()
          expected = '0 19 * * *' if offset == 3600 else '0 20 * * *'
          run = os.environ['EVENT_NAME'] == 'workflow_dispatch' or os.environ['SCHEDULE'] == expected
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(run).lower() + '\n')
          PY
      - name: Install and check ingestion
        if: steps.clock.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_ingestion.py' -v
      - name: Refresh public sources
        if: steps.clock.outputs.run == 'true'
        run: python scripts/refresh.py
      - name: Commit refreshed data
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data/events.json dist/data/societies.json data/review-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public event and society data'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
